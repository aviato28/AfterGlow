<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Inter, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="118%" r="85%">
      <stop offset="0" stop-color="#FFB070" stop-opacity=".55"/>
      <stop offset=".28" stop-color="#E8607A" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#5B3F8C" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0B0908" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC27A"/><stop offset=".6" stop-color="#F0707A"/><stop offset="1" stop-color="#8A4FA8"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <!-- background: near-black with a sunset glow rising from the bottom edge -->
  <rect width="1920" height="1080" fill="#0B0908"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- top bar: logo mark left, clock right -->
  <g transform="translate(96 70)">
    <path d="M0 34 A26 26 0 0 1 52 34 Z" fill="url(#sun)"/>
    <rect x="-6" y="38" width="64" height="3" rx="1.5" fill="#F3E9DF" opacity=".8"/>
    <text x="74" y="40" font-size="30" font-weight="500" fill="#F3E9DF" letter-spacing="1">afterglow</text>
  </g>
  <text x="1824" y="104" font-size="44" font-weight="300" fill="#F3E9DF" text-anchor="end">9:41 PM</text>

  <!-- greeting -->
  <text x="96" y="300" font-size="84" font-weight="300" fill="#F3E9DF">Good evening</text>
  <text x="100" y="352" font-size="26" fill="#B8ADA3">Saturday, 18 October</text>

  <!-- favourites row: apps' own 16:9 banners -->
  <text x="96" y="470" font-size="24" font-weight="600" fill="#B8ADA3" letter-spacing="2">FAVOURITES</text>
  <!-- focused tile: lifted, warm glow + ring -->
  <rect x="90" y="500" width="384" height="216" rx="22" fill="#FF9E5E" opacity=".55" filter="url(#soft)"/>
  <rect x="90" y="500" width="384" height="216" rx="22" fill="#E50914"/>
  <rect x="90" y="500" width="384" height="216" rx="22" fill="none" stroke="#FFD9B0" stroke-width="5"/>
  <text x="282" y="622" font-size="48" font-weight="800" fill="#fff" text-anchor="middle">NETFLIX</text>
  <text x="96" y="760" font-size="24" fill="#F3E9DF">Netflix</text>

  <g font-size="40" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="514" y="516" width="320" height="180" rx="20" fill="#202020"/><text x="674" y="618">YouTube</text>
    <rect x="874" y="516" width="320" height="180" rx="20" fill="#0F2A4A"/><text x="1034" y="618">prime video</text>
    <rect x="1234" y="516" width="320" height="180" rx="20" fill="#0E1A5C"/><text x="1394" y="618">Disney+</text>
    <rect x="1594" y="516" width="320" height="180" rx="20" fill="#1F1A10"/><text x="1754" y="618" fill="#E5A00D">plex</text>
  </g>

  <!-- bottom row: all apps, settings (quiet pills) -->
  <g font-size="26" fill="#F3E9DF">
    <rect x="1484" y="850" width="220" height="72" rx="36" fill="#F3E9DF" fill-opacity=".08" stroke="#F3E9DF" stroke-opacity=".14"/>
    <text x="1594" y="895" text-anchor="middle">All apps</text>
    <rect x="1724" y="850" width="100" height="72" rx="36" fill="#F3E9DF" fill-opacity=".08" stroke="#F3E9DF" stroke-opacity=".14"/>
    <circle cx="1774" cy="886" r="13" fill="none" stroke="#F3E9DF" stroke-width="3"/><circle cx="1774" cy="886" r="4" fill="#F3E9DF"/>
  </g>
</svg>
